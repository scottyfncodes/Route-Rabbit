<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f7a72"/>
      <stop offset="1" stop-color="#0f3a37"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3efec"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Route: a dashed path that ends at the pin -->
  <path d="M96 430 C 150 430, 168 392, 214 392 S 256 410, 256 410" fill="none" stroke="#7fd1c4" stroke-width="10" stroke-linecap="round" stroke-dasharray="1 22" opacity=".9"/>
  <circle cx="96" cy="430" r="13" fill="#7fd1c4"/>
  <!-- Pin with rabbit ears: one clean silhouette -->
  <g fill="url(#mark)">
    <path d="M256 418 C 232 380, 168 318, 168 262 A 88 88 0 0 1 344 262 C 344 318, 280 380, 256 418 Z"/>
    <path d="M206 196 C 186 150, 180 104, 196 84 C 214 64, 236 96, 244 150 L 248 184 Z"/>
    <path d="M306 196 C 326 150, 332 104, 316 84 C 298 64, 276 96, 268 150 L 264 184 Z"/>
  </g>
  <!-- Ear separation from head, and the pin's hole -->
  
  <circle cx="256" cy="262" r="38" fill="#ef6b4f"/>
</svg>
