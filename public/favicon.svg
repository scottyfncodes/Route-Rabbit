<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1f8f81"/>
      <stop offset="1" stop-color="#0d4a43"/>
    </linearGradient>
    <linearGradient id="carrot" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#ffa449"/>
      <stop offset="0.55" stop-color="#f7801f"/>
      <stop offset="1" stop-color="#e2600f"/>
    </linearGradient>
    <linearGradient id="leafA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ad97f"/>
      <stop offset="1" stop-color="#43b05a"/>
    </linearGradient>
    <linearGradient id="leafB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cc46c"/>
      <stop offset="1" stop-color="#2f9149"/>
    </linearGradient>
    <clipPath id="body">
      <path d="M256 438 C 240 398 164 290 164 222 C 164 172 204 144 256 144 C 308 144 348 172 348 222 C 348 290 272 398 256 438 Z"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- route leading to the pin -->
  <path d="M118 442 C 160 436 172 404 208 402 S 240 428 250 434" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round" stroke-dasharray="0.1 24"/>
  <circle cx="92" cy="444" r="12" fill="#ffffff" fill-opacity="0.75"/>
  <!-- ground shadow -->
  <ellipse cx="256" cy="440" rx="46" ry="10" fill="#052a26" opacity="0.35"/>
  <!-- greens -->
  <path d="M242 156 C 200 140 168 108 160 72 C 202 76 236 104 250 146 Z" fill="url(#leafB)"/>
  <path d="M270 156 C 312 140 344 108 352 72 C 310 76 276 104 262 146 Z" fill="url(#leafB)"/>
  <path d="M256 152 C 232 120 224 80 240 48 C 262 70 276 110 262 152 Z" fill="url(#leafA)"/>
  <!-- carrot pin -->
  <path d="M256 438 C 240 398 164 290 164 222 C 164 172 204 144 256 144 C 308 144 348 172 348 222 C 348 290 272 398 256 438 Z" fill="url(#carrot)"/>
  <g clip-path="url(#body)">
    <!-- soft right-side shade -->
    <path d="M300 130 C 360 190 350 320 250 460 L 400 460 L 400 130 Z" fill="#b8460a" opacity="0.18"/>
    <!-- left highlight -->
    <path d="M198 200 C 196 240 206 280 224 316" fill="none" stroke="#fff" stroke-opacity="0.28" stroke-width="12" stroke-linecap="round"/>
    <!-- ridges -->
    <g stroke="#b9500f" stroke-opacity="0.55" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M150 262 L 200 268"/>
      <path d="M362 300 L 304 308"/>
      <path d="M170 344 L 222 352"/>
      <path d="M340 236 L 300 240"/>
    </g>
  </g>
</svg>
