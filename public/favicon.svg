<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27a08f"/>
      <stop offset="1" stop-color="#0f5b52"/>
    </linearGradient>
    <linearGradient id="carrot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffa04a"/>
      <stop offset="1" stop-color="#ec6a1b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <clipPath id="r"><rect width="512" height="512" rx="112"/></clipPath>
  <!-- map streets -->
  <g clip-path="url(#r)" stroke="#ffffff" stroke-opacity="0.09" stroke-width="18" fill="none" stroke-linecap="round">
    <path d="M-20 150 L540 110"/>
    <path d="M-20 360 L540 300"/>
    <path d="M120 -20 L160 540"/>
    <path d="M400 -20 L380 540"/>
  </g>
  <!-- the route, from a home to the pin -->
  <path d="M84 446 C 140 446 150 390 196 384 S 250 420 256 420" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 26"/>
  <circle cx="84" cy="446" r="14" fill="#fff"/>
  <!-- ground shadow under the pin -->
  <ellipse cx="256" cy="430" rx="54" ry="13" fill="#062e29" opacity="0.4"/>
  <!-- carrot greens -->
  <g fill="#5fd06a" stroke="#174d2b" stroke-width="8" stroke-linejoin="round">
    <path d="M256 128 C 222 98 206 60 222 36 C 252 54 262 92 256 128 Z"/>
    <path d="M256 128 C 290 98 306 60 290 36 C 260 54 250 92 256 128 Z"/>
    <path d="M256 132 C 214 128 176 100 172 70 C 210 72 244 100 256 132 Z" fill="#48b956"/>
    <path d="M256 132 C 298 128 336 100 340 70 C 302 72 268 100 256 132 Z" fill="#48b956"/>
  </g>
  <!-- carrot as a map pin -->
  <path d="M256 424 C 236 380 168 270 168 210 C 168 158 208 124 256 124 C 304 124 344 158 344 210 C 344 270 276 380 256 424 Z" fill="url(#carrot)" stroke="#7a2f08" stroke-width="8" stroke-linejoin="round"/>
  <g stroke="#b9500f" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M182 260 q 18 6 34 0"/>
    <path d="M300 286 q 16 6 30 -2"/>
    <path d="M216 330 q 14 6 26 0"/>
  </g>
  <circle cx="256" cy="204" r="40" fill="#fff8ee" stroke="#7a2f08" stroke-width="8"/>
  <circle cx="256" cy="204" r="16" fill="#1f8a7c"/>
</svg>
